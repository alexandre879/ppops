# Opens monthly pull requests with dependency updates; the Checks workflow tests each one.
# Merging one deploys it (deploy.yml), so read the release notes of major updates first.
#
# Python packages are left out on purpose: requirements.txt pins ranges (Django 5.2 LTS,
# django-modeltranslation < 0.21) and every deploy build already installs the newest patch
# releases inside them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native Go compiler) is not supported by typescript-eslint yet, which
      # eslint-config-next depends on; `npm run lint` crashes on it. Drop this once
      # typescript-eslint supports TS >= 7 (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      admin-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native Go compiler) is not supported by typescript-eslint yet, which
      # eslint-config-next depends on; `npm run lint` crashes on it. Drop this once
      # typescript-eslint supports TS >= 7 (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
