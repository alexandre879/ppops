# Reverse proxy for the New House World platform.
#   :80   public website  (Next.js "web")  + read-only public API
#   :8080 admin platform  (Next.js "admin") + full REST API
# In production, give each server block its own domain (server_name) and TLS.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Resolve container names at request time through Docker's DNS. Fixed upstream blocks
# resolve once at startup, so after containers are recreated (new IPs) nginx would keep
# sending traffic to stale addresses, e.g. the website's port reaching the admin app.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    set $backend_upstream backend:8000;
    set $web_upstream web:3000;
    client_max_body_size 25m;

    # Only the read-only public API (+ enquiry form) is reachable from the website.
    location /api/public/ {
        proxy_pass http://$backend_upstream;
    }

    # Public uploads (Pillow-validated images only; private files never live here).
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://$web_upstream;
    }
}

server {
    listen 8080;
    server_name _;
    set $backend_upstream backend:8000;
    set $admin_upstream admin:3000;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_read_timeout 60s;
    }

    # Django's built-in admin (superusers) and its static files.
    location /django-admin/ {
        proxy_pass http://$backend_upstream;
    }
    location /static/ {
        proxy_pass http://$backend_upstream;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://$admin_upstream;
    }
}
