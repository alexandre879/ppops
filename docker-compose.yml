name: newhousemodern

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newhousemodern}
      POSTGRES_USER: ${POSTGRES_USER:-nhm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nhm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-newhousemodern}
      CACHE_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private_media
      NUM_PROXIES: "1"
    volumes:
      - media:/app/media
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        API_PROXY_TARGET: http://backend:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        API_PROXY_TARGET: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
      - "${ADMIN_PORT:-8081}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      - web
      - admin

volumes:
  pgdata:
  media:
  private_media:
