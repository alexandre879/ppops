# Uploads: public images (media, also served by the gateway) and private files (private-media).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: private-media
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  # The entrypoint runs migrations, so never let two versions start at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        # The image runs as "app" (uid 1000); let it write to the upload volumes.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: ppops-backend:local
          imagePullPolicy: IfNotPresent
          # One process with threads: far less memory than several gunicorn workers.
          args:
            - gunicorn
            - config.wsgi:application
            - --bind=0.0.0.0:8000
            - --workers=1
            - --threads=4
            - --timeout=60
            - --access-logfile=-
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ppops-config
            - secretRef:
                name: ppops-secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ppops-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppops-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ppops-postgres
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          # Django only answers known hosts, so the probes say they're "backend".
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: backend
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: backend
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: private-media
              mountPath: /app/private_media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: private-media
          persistentVolumeClaim:
            claimName: private-media
